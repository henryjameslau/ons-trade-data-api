name: Update ONS Trade Data

on:
  schedule:
    # Run at 7am UTC on weekdays (Mon-Fri)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check and download new ONS files
        id: download
        run: |
          set -euo pipefail
          FILES_CHANGED=false

          # ONS bot guidance: https://developer.ons.gov.uk/bots/
          # Use a descriptive bot User-Agent. Honour Retry-After on 429.
          UA="ONSTradeDataUpdater/1.0.0(+https://github.com/${{ github.repository }})"

          # Download URL to a destination file. On 429 reads Retry-After header
          # and waits before retrying (up to 5 attempts). Exits non-zero on failure.
          # Does NOT use curl -f/--fail to avoid exit-22 masking the retry logic.
          fetch_url() {
            local url="$1"
            local dest="$2"
            local attempt=1

            while [ $attempt -le 5 ]; do
              local header_file
              header_file=$(mktemp)

              # Write status code to a separate temp file to avoid mixing with -w output
              local status_file
              status_file=$(mktemp)

              curl -sSL -A "$UA" -D "$header_file" -o "$dest" \
                -w "%{http_code}" "$url" > "$status_file" 2>&1 || true

              local http_code
              http_code=$(cat "$status_file")
              rm -f "$status_file"

              if [ "$http_code" = "200" ]; then
                rm -f "$header_file"
                return 0
              fi

              echo "  HTTP $http_code on attempt $attempt/5"

              if [ "$http_code" = "429" ]; then
                local retry_after
                retry_after=$(grep -i '^retry-after:' "$header_file" \
                  | head -1 | awk '{print $2}' | tr -d '\r' || true)
                retry_after=${retry_after:-60}
                echo "  Rate limited. Retry-After: ${retry_after}s — waiting..."
                rm -f "$header_file"
                sleep "$retry_after"
              else
                rm -f "$header_file"
                sleep 30
              fi

              attempt=$((attempt + 1))
            done

            echo "ERROR: Could not download $url after 5 attempts"
            return 1
          }

          # ── All Countries SA ─────────────────────────────────────────────────
          # This file has a date in its name (e.g. allcountriesjune2026.xlsx).
          # Scrape the ONS page JSON-LD to find the current filename.
          echo "==> Detecting current allcountries filename..."
          PAGE_FILE=$(mktemp)
          fetch_url \
            "https://www.ons.gov.uk/economy/nationalaccounts/balanceofpayments/datasets/uktradeallcountriesseasonallyadjusted" \
            "$PAGE_FILE"

          ALLCOUNTRIES_URL=$(python3 -c "
          import sys, json, re
          html = open('$PAGE_FILE').read()
          m = re.search(r'<script type=\"application/ld\+json\">(.*?)</script>', html, re.DOTALL)
          data = json.loads(m.group(1))
          for d in data.get('distribution', []):
              if d.get('encodingFormat') == 'xlsx':
                  print(d['contentUrl']); sys.exit(0)
          sys.exit(1)
          ")
          rm -f "$PAGE_FILE"

          ALLCOUNTRIES_FILE=$(basename "$ALLCOUNTRIES_URL" | cut -d'?' -f1)
          echo "  Current file: $ALLCOUNTRIES_FILE"

          if [ ! -f "data/raw/$ALLCOUNTRIES_FILE" ]; then
            echo "  New file detected — downloading..."
            rm -f data/raw/allcountries*.xlsx
            sleep 3
            fetch_url "$ALLCOUNTRIES_URL" "data/raw/$ALLCOUNTRIES_FILE"
            echo "  Downloaded $ALLCOUNTRIES_FILE"
            FILES_CHANGED=true
          else
            echo "  No change."
          fi

          # ── Stable-URL files ──────────────────────────────────────────────────
          # These filenames never change — download directly, detect changes by hash.
          # A 3s pause between each request keeps us well within ONS rate limits.

          echo "==> Downloading countrybycommodityexports.xlsx..."
          sleep 3
          OLD=$(sha256sum data/raw/countrybycommodityexports.xlsx 2>/dev/null | awk '{print $1}' || echo none)
          fetch_url \
            "https://www.ons.gov.uk/file?uri=/economy/nationalaccounts/balanceofpayments/datasets/uktradecountrybycommodityexports/current/countrybycommodityexports.xlsx" \
            data/raw/countrybycommodityexports.xlsx
          NEW=$(sha256sum data/raw/countrybycommodityexports.xlsx | awk '{print $1}')
          [ "$OLD" != "$NEW" ] && { echo "  Changed."; FILES_CHANGED=true; } || echo "  Unchanged."

          echo "==> Downloading countrybycommodityimports.xlsx..."
          sleep 3
          OLD=$(sha256sum data/raw/countrybycommodityimports.xlsx 2>/dev/null | awk '{print $1}' || echo none)
          fetch_url \
            "https://www.ons.gov.uk/file?uri=/economy/nationalaccounts/balanceofpayments/datasets/uktradecountrybycommodityimports/current/countrybycommodityimports.xlsx" \
            data/raw/countrybycommodityimports.xlsx
          NEW=$(sha256sum data/raw/countrybycommodityimports.xlsx | awk '{print $1}')
          [ "$OLD" != "$NEW" ] && { echo "  Changed."; FILES_CHANGED=true; } || echo "  Unchanged."

          echo "==> Downloading mret.csv..."
          sleep 3
          OLD=$(sha256sum data/raw/mret.csv 2>/dev/null | awk '{print $1}' || echo none)
          fetch_url \
            "https://www.ons.gov.uk/file?uri=/economy/nationalaccounts/balanceofpayments/datasets/tradeingoodsmretsallbopeu2013timeseriesspreadsheet/current/mret.csv" \
            data/raw/mret.csv
          NEW=$(sha256sum data/raw/mret.csv | awk '{print $1}')
          [ "$OLD" != "$NEW" ] && { echo "  Changed."; FILES_CHANGED=true; } || echo "  Unchanged."

          echo "files_changed=$FILES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "==> Files changed: $FILES_CHANGED"

      - name: Run data processing pipeline
        if: steps.download.outputs.files_changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          echo "Running parse-data (country-by-commodity exports + imports)..."
          npm run parse-data
          echo "Running parse-allcountries (all countries SA totals)..."
          npm run parse-allcountries
          echo "Running parse-services..."
          npm run parse-services
          echo "Running generate-files..."
          npm run generate-files

      - name: Validate output
        if: steps.download.outputs.files_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          SCHEMA_FILE="static/data/meta/schema.json"
          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "ERROR: $SCHEMA_FILE not found — processing may have failed"
            exit 1
          fi

          TOTAL_RECORDS=$(python3 -c "import json; d=json.load(open('$SCHEMA_FILE')); print(d['total_records'])")
          echo "Total records in output: $TOTAL_RECORDS"

          MIN_RECORDS=100000
          if [ "$TOTAL_RECORDS" -lt "$MIN_RECORDS" ]; then
            echo "ERROR: Only $TOTAL_RECORDS records — expected at least $MIN_RECORDS. Processing may have failed."
            exit 1
          fi

          echo "Validation passed: $TOTAL_RECORDS records"

      - name: Commit and push updated data
        if: steps.download.outputs.files_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/raw/ static/data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u '+%Y-%m-%d')
            git commit -m "Update ONS trade data ($DATE)

          Automated update: downloaded latest files from ONS and regenerated static data."
            # Pull with rebase in case another workflow run pushed while this one ran
            git pull --rebase origin main
            git push
            echo "Committed and pushed updated data"
          fi
